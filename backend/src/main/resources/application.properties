# Application Configuration
spring.application.name=online-clinic-system
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/ocs_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
app.jwt-secret=OcsSecureJwtSecret2024XyZ9a2f8c4e7b1d3f6a8e0c2b4d6f8a1c3e5h7j9l0m2
app.jwt-expiration-milliseconds=86400000

# JSON Formatting
spring.jackson.serialization.write-dates-as-timestamps=false
