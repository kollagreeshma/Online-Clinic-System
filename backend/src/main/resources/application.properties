# ==========================================
# Application Configuration
# ==========================================
spring.application.name=online-clinic-system

server.port=${PORT:8080}

# ==========================================
# Database Configuration - Railway MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:ocs_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA & Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT Security Configuration
# ==========================================
app.jwt-secret=${JWT_SECRET:613802e8e928014f13157eb68a2f905d297a28732050c86c3341f77ba884815c69323af00d76e68f20975b51e5a727a2569b5bd866004acae3fe9e7e38676f8a}
app.jwt-expiration-milliseconds=86400000

# ==========================================
# CORS Configuration
# ==========================================
frontend.url=${FRONTEND_URL:}

# ==========================================
# JSON Formatting
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false