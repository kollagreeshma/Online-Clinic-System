# ==========================================
# Application Configuration
# ==========================================
spring.application.name=online-clinic-system

server.port=${PORT:8080}

# ==========================================
# Database Configuration - Railway MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:ocs_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA & Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT Security Configuration
# ==========================================
app.jwt-secret=${JWT_SECRET:OcsSecureJwtSecret2024XyZ9a2f8c4e7b1d3f6a8e0c2b4d6f8a1c3e5h7j9l0m2}
app.jwt-expiration-milliseconds=86400000

# ==========================================
# CORS Configuration
# ==========================================
frontend.url=${FRONTEND_URL:}

# ==========================================
# JSON Formatting
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false