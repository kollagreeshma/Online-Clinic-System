# ==========================================
# Application Configuration
# ==========================================
spring.application.name=online-clinic-system

# Railway provides the PORT environment variable
server.port=${PORT:8080}


# ==========================================
# Database Configuration - Railway MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA & Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# JWT Security Configuration
# ==========================================
app.jwt-secret=OcsSecureJwtSecret2024XyZ9a2f8c4e7b1d3f6a8e0c2b4d6f8a1c3e5h7j9l0m2
app.jwt-expiration-milliseconds=86400000


# ==========================================
# JSON Formatting
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false